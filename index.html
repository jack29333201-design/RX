<style>
  /* ☀️ 鼠尾草 Sage */
  :root {
    --font: -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --bg: #F4F6F3; --surface: #FFFFFF; --surface2: #F5F8F5; --line: #DCE3DA;
    --ink: #26332B; --drug: #26332B; --muted: #4A5A50;
    --accent: #5F7F6B; --on-accent: #FFFFFF;
    --jade: linear-gradient(90deg, #7A9C86 0%, #5F7F6B 100%);
    --header: linear-gradient(135deg, #55705F 0%, #6E8A78 55%, #8AA593 100%); --header-ink: #FFFFFF;
    --title: linear-gradient(90deg, #FFFFFF 0%, #EEF5F0 55%, #E3EEE6 100%);
    --vendor: linear-gradient(180deg, #E4ECE6 0%, #D2DFD6 100%); --vendor-ink: #3F5848;
    --danger: #B23B3B;
    --p-已訂貨: #2F6FB8; --p-已調貨: #2E8B4E; --p-缺藥: #C94F4F; --p-其他: #7A5BB0;
    --card-shadow: 0 1px 2px rgba(40,60,48,.06), 0 4px 14px rgba(40,60,48,.08);
    --ph: #A8B5AC;
    color-scheme: light;
  }
  :root:not([data-theme="dark"]) .btn.primary, :root:not([data-theme="dark"]) .fab, :root:not([data-theme="dark"]) .chip.on {
    background: var(--jade); border-color: #5F7F6B; color: #fff; }
  :root:not([data-theme="dark"]) .fab { box-shadow: 0 8px 22px rgba(85,112,95,.3); }
  :root:not([data-theme="dark"]) .vtabs button.on { color: #3F5848; }
  :root:not([data-theme="dark"]) .day-h { background: linear-gradient(90deg, #55705F, #8AA593); color: #fff; }
  :root:not([data-theme="dark"]) .it-no { color: #55705F; }
  /* 🌙 金墨 Black gold */
  :root[data-theme="dark"] {
    --bg: #0C0C0E; --surface: #17171B; --surface2: #1F1F24; --line: #2E2C30;
    --ink: #F1ECE0; --drug: #FFF6E0; --muted: #B9B2A2;
    --accent: #D4AF37; --on-accent: #1A1405;
    --gold: linear-gradient(90deg, #F0D77C 0%, #D4AF37 55%, #B8892A 100%);
    --header: linear-gradient(135deg, #141417 0%, #1C1A17 55%, #2A2416 100%); --header-ink: #F1ECE0;
    --title: linear-gradient(90deg, #F6E7B4 0%, #E3C25A 50%, #B8892A 100%);
    --vendor: #241F15; --vendor-ink: #F0D77C;
    --danger: #FF8A8A;
    --p-已訂貨: #7DB8FF; --p-已調貨: #6FD99A; --p-缺藥: #FF7A7A; --p-其他: #D3B8FF;
    --card-shadow: 0 0 0 1px rgba(212,175,55,.06), 0 6px 18px rgba(0,0,0,.45);
    --ph: #6E6857;
    color-scheme: dark;
  }
  :root[data-theme="dark"] header { border-bottom: 1px solid rgba(212,175,55,.35); }
  :root[data-theme="dark"] .btn.primary, :root[data-theme="dark"] .fab,
  :root[data-theme="dark"] .vtabs button.on, :root[data-theme="dark"] .chip.on {
    background: var(--gold); border-color: #D4AF37; color: #1A1405; }
  :root[data-theme="dark"] .fab { box-shadow: 0 8px 24px rgba(212,175,55,.28); }
  :root[data-theme="dark"] .vtabs button { border-color: rgba(212,175,55,.3); }
  :root[data-theme="dark"] .day-h { background: linear-gradient(90deg, #1E1B14, #2A2416); color: #F0D77C; border: 1px solid rgba(212,175,55,.35); }
  :root[data-theme="dark"] .day-share { border-color: rgba(240,215,124,.6); }
  :root[data-theme="dark"] .block { border-color: #2A2720; }
  :root[data-theme="dark"] .it-no { color: #E3C25A; }
  :root[data-theme="dark"] .post.pinned { border-color: #D4AF37; }
  :root[data-theme="dark"] .theme-toggle .knob { background: var(--gold); color: #1A1405; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* 頂部 */
  header {
    position: sticky; top: 0; z-index: 5; background: var(--header); color: var(--header-ink);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
  }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; max-width: 760px; margin: 0 auto; }
  h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .06em;
    background: var(--title); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hbtns { display: flex; align-items: center; gap: 6px; }
  .hbtn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25); color: var(--header-ink);
    border-radius: 999px; padding: 4px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
  .hbtn svg { width: 15px; height: 15px; }
  .hbtn.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .theme-toggle { position: relative; width: 52px; height: 28px; flex: none; padding: 0; border-radius: 999px;
    border: 1px solid #2B2B2B; background: #2B2B2B; transition: background-color .3s; }
  .theme-toggle .knob { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; background: #fff; color: #1A1A1A; transition: transform .3s cubic-bezier(.4,1.3,.6,1), background-color .3s; }
  .theme-toggle svg { width: 14px; height: 14px; }
  .theme-toggle .moon { display: none; }
  :root[data-theme="dark"] .theme-toggle { background: #fff; border-color: #D9D9D9; }
  :root[data-theme="dark"] .theme-toggle .knob { transform: translateX(24px); background: #111; color: #fff; }
  :root[data-theme="dark"] .theme-toggle .sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .moon { display: block; }

  main { max-width: 760px; margin: 0 auto; padding: 12px 12px calc(110px + env(safe-area-inset-bottom, 0px)); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }

  /* 大 block */

    color: var(--header-ink); border-radius: 10px; padding: 8px 4px; font-size: 16px; font-weight: 700; }
  .vtabs button.on { background: var(--header-ink); color: var(--drug); border-color: var(--header-ink); }
  .bdg { position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
    background: #E5484D; color: #fff; font-size: 12px; line-height: 20px; }
  .bdg[hidden] { display: none; }
  /* 公佈欄 */
  .compose { padding: 14px; }

  .compose-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
  .compose-row .btn { flex: 0 0 140px; }
  .post { padding: 12px 14px; }
  .post.pinned { border: 2px solid var(--accent); }
  .post-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .post-by { font-weight: 700; color: var(--drug); font-size: 17px; }
  .post-at { font-size: 14px; color: var(--muted); }
  .post-text { white-space: pre-wrap; word-break: break-word; font-size: 18px; line-height: 1.55; color: var(--ink); }
  .post-a { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .post-a .chipbtn { font-size: 14px; min-height: 36px; padding: 4px 12px; }
  .gen-row { display: grid; grid-template-columns: minmax(64px, 1fr) minmax(64px, 1fr) minmax(104px, 1.5fr); gap: 6px; margin-top: 8px; }
  .gen-row .f { width: 100% !important; max-width: none; }
  .by-r { text-align: right; margin-top: 2px; }
  .x.sm { min-width: 36px; min-height: 36px; margin-left: 0; font-size: 22px; padding: 0; }
  .it-top { align-items: center; }
  .it-top .it-drug { flex: 1; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .row3 .chipbtn { padding: 9px 4px; font-size: 15px; white-space: nowrap; }
  .row2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 6px; }
  .row2 .f { width: 100%; max-width: none; }
</style>

      <button class="hbtn" id="refresh" aria-label="重新整理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>

        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>

<script src="config.js"></script>
<script>
// API_URL 放在 config.js（這樣更新 index.html 時就不用重填）

const APP_VERSION = '2026-10-29.22'; // 每次更新 index.html 會改這個
const PROGRESS = ['已訂貨', '已調貨', '缺藥', '其他'];
const SLIP = ['已key', '缺貨單'];
const slipName = s => ({ '貨單已key': '已key', '缺貨單需要電子檔': '缺貨單' }[s] || s || ''); // 舊資料換成新名稱
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d = '') { try { return localStorage.getItem('jy_' + k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jy_' + k, v); } catch (e) {} },
};
const today = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const fmtQty = (q, u) => (q === null || q === undefined || q === '') ? (u ? '? ' + u : '') : `${q} ${u || ''}`.trim();

let S = { blocks: [], drugs: [], lists: { vendors: [], units: [], staff: [] }, posts: [] };
let me = store.get('name'), pass = store.get('pass');

// ======================== 主題 ========================
function applyTheme() {
  const t = store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0C0C0E' : '#55705F';
}
$('themeBtn').onclick = () => { store.set('theme', document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); applyTheme(); };
applyTheme();

// ======================== 連線 ========================
let pending = 0;
async function api(action, data = {}, retried, opt) {
  pending++; $('saving').classList.add('on');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免跨網域預檢
      body: JSON.stringify(Object.assign({ action, pass, by: me }, data)),
    });
    const j = await res.json();
    if (!j.ok && !retried && /BUSY:|鎖定|lock/i.test(j.error || '')) {
      pending--; await new Promise(r => setTimeout(r, 2500)); pending++;
      return api(action, data, true, opt); // 伺服器忙，自動再試一次
    }
    if (!j.ok) {
      j.error = String(j.error || '').replace(/^BUSY:/, '');
      if (j.code === 'PASS') { openSettings('me', '團隊密碼錯誤，請重新輸入'); }
      throw new Error(j.error || '發生錯誤');
    }
    applyRes(j, opt);
    return j;
  } catch (e) {
    if (e instanceof TypeError) e = new Error('連線失敗，請檢查網路或 API 網址');
    throw e;
  } finally {
    if (--pending <= 0) { pending = 0; $('saving').classList.remove('on'); }
  }
}
// 後面還有排隊中的修改時，先不要用伺服器回來的舊資料蓋掉畫面（本機已經是最新）
function applyRes(j) {
  const later = queued > 1;
  if (j.drugs) S.drugs = j.drugs;
  if (j.lists && !later) S.lists = j.lists;
  if (j.posts && !later) { S.posts = j.posts; updateBadge(); }
  if (!later) {
    if (j.blocks) S.blocks = j.blocks;
    if (j.deleted) S.blocks = S.blocks.filter(b => b.id !== j.deleted);
    if (j.block) {
      const i = S.blocks.findIndex(b => b.id === j.block.id);
      if (i < 0) S.blocks.unshift(j.block); else S.blocks[i] = j.block;
    }
  }
  if (j.block || j.blocks || j.deleted || j.posts) renderSafe();
}

// ---- 立即更新畫面（樂觀更新），背景依序存檔 ----
const OPTIMISTIC = { updateItem: 1, vendorProgress: 1, vendorSlip: 1, updateBlock: 1, deleteItem: 1, vendorArchive: 1,
  deleteVendor: 1, deleteBlock: 1, deleteFile: 1, pinPost: 1, deletePost: 1, saveLists: 1 };
function optimistic(action, d) {
  const b = findBlock(d.blockId || d.id);
  const vend = () => { const k = d.vendor || ''; b.vendors = b.vendors || {}; return b.vendors[k] = b.vendors[k] || { slip: '', slipBy: '', files: [] }; };
  switch (action) {
    case 'updateItem': {
      const it = b && b.items.find(x => x.id === d.itemId); if (!it) break;
      for (const k in d.patch) {
        let v = d.patch[k];
        if (k === 'qty' || k === 'orderQty') v = v === '' || v === null ? null : Number(v);
        it[k] = v;
        if (k === 'progress') it.progressBy = v ? me : '';
      }
      break;
    }
    case 'vendorProgress': if (b) b.items.filter(it => (it.vendor || '') === (d.vendor || '')).forEach(it => { it.progress = d.progress; it.progressBy = me; }); break;
    case 'vendorSlip': if (b) { const v = vend(); if ('slip' in d) v.slip = d.slip; if ('slipBy' in d) v.slipBy = d.slipBy; } break;
    case 'updateBlock': if (b && d.date) b.date = d.date; break;
    case 'deleteItem': if (b) b.items = b.items.filter(x => x.id !== d.itemId); break;
    case 'vendorArchive': if (b) { const v = vend(); v.archived = !!d.archived; v.archivedAt = d.archived ? Date.now() : null; v.archivedBy = d.archived ? me : ''; } break;
    case 'deleteVendor': if (b) { b.items = b.items.filter(x => (x.vendor || '') !== (d.vendor || '')); if (!b.items.length) S.blocks = S.blocks.filter(x => x !== b); } break;
    case 'deleteBlock': S.blocks = S.blocks.filter(x => x.id !== d.id); break;
    case 'deleteFile': if (b) { const v = vend(); v.files = (v.files || []).filter(f => f.id !== d.fileId); } break;
    case 'pinPost': { const p = (S.posts || []).find(x => x.id === d.id); if (p) p.pinned = !!d.pinned; break; }
    case 'deletePost': S.posts = (S.posts || []).filter(x => x.id !== d.id); break;
    case 'saveLists': Object.assign(S.lists, d.lists); break;
  }
}
let writeQ = Promise.resolve(), queued = 0;
async function run(action, data, okMsg) {
  const opt = !!OPTIMISTIC[action];
  if (opt) { optimistic(action, data); renderSafe(); if (okMsg) toast(okMsg); }
  queued++;
  const job = writeQ.then(() => api(action, data, false, opt)); // 一個接一個送，順序不會亂
  writeQ = job.catch(() => {});
  try { const j = await job; if (!opt && okMsg) toast(okMsg); return j; }
  catch (e) { toast('沒存到：' + e.message); setTimeout(() => load(true), 300); }
  finally { queued--; }
}

// 正在打字時不重畫，離開輸入框後再更新
let needRender = false;
function typing() { const a = document.activeElement; return !!(a && a.closest && a.closest('#list') && a.matches('input, textarea')); }
function renderSafe() { if (typing()) { needRender = true; return; } needRender = false; render(); }

// ======================== 畫面 ========================
const findBlock = id => S.blocks.find(b => b.id === id);
const findDrug = name => S.drugs.find(d => d.name === name);
function groups(b) {
  const order = [], map = {};
  b.items.forEach(it => {
    const v = it.vendor || '';
    if (!map[v]) { map[v] = []; order.push(v); }
    map[v].push(it);
  });
  return order.map(v => ({ vendor: v, items: map[v] }));
}
const opts = (list, cur, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') +
  [...new Set([...(list || []), ...(cur ? [cur] : [])])].map(v => `<option${v === cur ? ' selected' : ''}>${esc(v)}</option>`).join('');

let view = 'main'; // main | history
const isArch = (b, vendor) => !!((b.vendors || {})[vendor || ''] || {}).archived;
const liveGroups = b => groups(b).filter(g => b.status !== 'generated' || !isArch(b, g.vendor));
const onMain = b => b.status !== 'generated' || !b.items.length || liveGroups(b).length > 0;
// 某一天的廠商卡，順序和畫面一樣（新的在上）
function dayCards(date) {
  const out = [];
  S.blocks.filter(b => b.status === 'generated' && b.date === date && onMain(b)).forEach(b => liveGroups(b).forEach(g => out.push({ b, g })));
  return out.sort((x, y) => (y.b.generatedAt || 0) - (x.b.generatedAt || 0));
}
// 這張卡第一個品項的編號前面有幾項（同一天的編號連續）
function cardStart(b, vendor) {
  let n = 0;
  for (const c of dayCards(b.date)) { if (c.b.id === b.id && c.g.vendor === (vendor || '')) return n; n += c.g.items.length; }
  return 0;
}
function render() {
  const el = $('list');
  document.body.classList.toggle('hist', view !== 'main');
  document.querySelectorAll('#vtabs button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  updateBadge();
  if (view === 'history') return renderHistory();
  if (view === 'board') return renderBoard();
  const list = S.blocks.filter(onMain);
  if (!list.length) {
    el.innerHTML = '<div class="empty">目前沒有進行中的叫藥單<br>按下方「＋ 新增叫藥單」開始</div>';
    return;
  }
  // 草稿在最上面；已生成的廠商卡依「日期」分組，新的日期在上
  const drafts = list.filter(b => b.status !== 'generated');
  const days = {};
  list.filter(b => b.status === 'generated').forEach(b => liveGroups(b).forEach(g => (days[b.date] = days[b.date] || []).push({ b, g })));
  const W_ = ['日', '一', '二', '三', '四', '五', '六'];
  const dayHTML = Object.keys(days).sort().reverse().map(d => {
    const cards = days[d].sort((x, y) => (y.b.generatedAt || 0) - (x.b.generatedAt || 0));
    const dt = new Date(d + 'T00:00:00'), wk = isNaN(dt) ? '' : `（${W_[dt.getDay()]}）`;
    return `<div class="day" data-date="${esc(d)}"><div class="day-h"><span>📅 <span class="dlong">${esc(d)}</span><span class="dshort">${esc(d.slice(5).replace('-', '/'))}</span>${wk}<small>${cards.length} 家廠商</small></span>
        <span class="day-btns"><button class="day-share"><span class="long">再次生成</span>叫藥清單</button><button class="day-prog">進度分享</button></span></div>
      ${(() => { let s = 0; return cards.map(c => { const h_ = vendorCardHTML(c.b, c.g, s); s += c.g.items.length; return h_; }).join(''); })()}</div>`;
  }).join('');
  el.innerHTML = drafts.map(blockHTML).join('') + dayHTML;
}
function renderBlock(id) {
  if (view === 'history') return render();
  const bb = findBlock(id);
  if (!bb || bb.status === 'generated' || document.querySelector(`.day .block[data-id="${CSS.escape(id)}"]`)) return render(); // 已生成的卡要重新分組
  const b = findBlock(id), olds = [...document.querySelectorAll(`.block[data-id="${CSS.escape(id)}"]`)];
  if (!olds.length) return render();
  if (b && onMain(b)) {
    const t = document.createElement('div'); t.innerHTML = blockHTML(b);
    [...t.children].forEach(n => olds[0].before(n));
  }
  olds.forEach(o => o.remove());
  if (!document.querySelector('.block')) render();
}

function blockHTML(b) {
  if (b.status === 'generated') return liveGroups(b).map(g => vendorCardHTML(b, g)).join('');
  const head = `<div class="b-head">
      <input type="date" class="b-date" value="${esc(b.date)}">
      <span class="b-meta">${b.items.length} 項 · ${esc(b.createdBy || '')}</span>
      <button class="icon b-del" aria-label="刪除整張">🗑</button>
    </div>`;
  const body = b.items.length ? groups(b).map(g => vendorHTML(b, g)).join('') :
    `<div class="empty" style="padding:20px">按「＋ 新增品項」加入要叫的藥</div>`;
  const foot = `<div class="b-foot">
      <button class="btn ghost add-item">＋ 新增品項</button>
      <button class="btn primary gen"${b.items.length ? '' : ' disabled'}>生成叫藥清單並通知群組</button>
    </div>`;
  return `<section class="block is-draft" data-id="${esc(b.id)}"><div class="draft-tag"><span>草<br>稿</span></div><div class="draft-main">${head}${body}${foot}</div></section>`;
}

// 已生成：每個廠商一張獨立的卡
// 直排：一個中文字一行，英文數字連在一起
const vtext = s => (String(s).match(/[A-Za-z0-9.\-]+|\S/gu) || []).map(esc).join('<br>');
function vendorCardHTML(b, g, start = 0) {
  const v = (b.vendors || {})[g.vendor] || {};
  const files = (v.files || []).map(f => `<div>📄 <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <span class="by">${esc(f.by || '')}</span><button class="x fdel" data-file="${esc(f.id)}" aria-label="刪除檔案">×</button></div>`).join('');
  return `<section class="block is-gen" data-id="${esc(b.id)}" data-vendor="${esc(g.vendor)}">
      <div class="v-side gen-side${g.items.length <= 2 ? ' side2' : ''}">
        <span class="vs-name">${vtext(g.vendor || '未指定廠商')}</span>
        <button class="sbtn vshare line-chip">進度<br>分享</button>
        <button class="sbtn vbtn" data-p="已訂貨" style="--c:var(--p-已訂貨)">已訂</button>
        <button class="sbtn vbtn" data-p="已調貨" style="--c:var(--p-已調貨)">已調</button>
        <span class="s-sep"></span>
        <select class="f slip side-sel" aria-label="貨單狀態">${opts(SLIP, slipName(v.slip), '貨單')}</select>
        <span class="by-lbl">by</span>
        <select class="f slipby side-sel" aria-label="貨單處理人員">${opts(S.lists.staff, v.slipBy, '人員')}</select>
        <button class="sbtn upload">上傳<br><span class="u2">貨單</span></button>

// ======================== 列表上的操作 ========================
const ctx = el => {
  const bEl = el.closest('.block'), vEl = el.closest('[data-vendor]'), iEl = el.closest('.item');
  return { blockId: bEl && bEl.dataset.id, vendor: vEl ? vEl.dataset.vendor : undefined, itemId: iEl && iEl.dataset.item };
};
// LINE 內建瀏覽器有時下拉選單只觸發 input、不觸發 change → 兩個都聽，但同一個值只送一次
const onListChange = e => {
  const t = e.target;
  if (e.type === 'input' && t.tagName !== 'SELECT') return;
  if (t.tagName === 'SELECT') { if (t.dataset.sent === t.value) return; t.dataset.sent = t.value; }
  const c = ctx(t);
  if (t.classList.contains('b-date')) return run('updateBlock', { id: c.blockId, date: t.value });
  const patchKey = { qty: 'qty', unit: 'unit', vendor: 'vendor', prog: 'progress', oq: 'orderQty', ou: 'orderUnit', 'note-in': 'note', 'pnote-in': 'progressNote' };
  if (t.classList.contains('prog') && t.value === '其他') {
    const b = findBlock(c.blockId), it = b && b.items.find(x => x.id === c.itemId);
    const prev = it ? it.progress : '';
    return askText(`「${it ? it.drug : ''}」其他進度`, it && it.progressNote || '', text => {
      t.dataset.p = '其他';
      run('updateItem', { blockId: c.blockId, itemId: c.itemId, patch: { progress: '其他', progressNote: text } }).then(j => {
        const nb = j && j.block, ni = nb && nb.items.find(x => x.id === c.itemId);
        if (ni && ni.progress !== '其他') toast('後端還是舊版：請把最新的 Code.gs 部署成「新版本」');
      });
    }, () => { t.value = prev || ''; t.dataset.sent = t.value; t.dataset.p = prev || ''; });
  }
  for (const cls in patchKey) if (t.classList.contains(cls)) {
    if (cls === 'prog') t.dataset.p = t.value;
    return run('updateItem', { blockId: c.blockId, itemId: c.itemId, patch: { [patchKey[cls]]: t.value } });
  }
  if (t.classList.contains('slip')) return run('vendorSlip', { blockId: c.blockId, vendor: c.vendor, slip: t.value });
  if (t.classList.contains('slipby')) return run('vendorSlip', { blockId: c.blockId, vendor: c.vendor, slipBy: t.value });
};
$('list').addEventListener('change', onListChange);
$('list').addEventListener('focusout', () => setTimeout(() => { if (needRender && !typing()) renderSafe(); }, 0));
$('list').addEventListener('input', onListChange);
$('list').addEventListener('focusin', e => { if (e.target.tagName === 'SELECT') e.target.dataset.sent = e.target.value; });
$('list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input.f')) e.target.blur(); });
$('list').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.classList.contains('day-share')) return shareDay(t.closest('.day').dataset.date);
  if (t.classList.contains('day-prog')) return shareDay(t.closest('.day').dataset.date, 'progress');
  const c = ctx(t), b = findBlock(c.blockId);
  if (t.classList.contains('add-item')) return openWizard(c.blockId, b.status === 'generated' ? (c.vendor || '') : undefined);
  if (t.classList.contains('del')) {
    const it = b.items.find(x => x.id === c.itemId);
    if (confirm(`刪除「${it ? it.drug : ''}」？`)) run('deleteItem', { blockId: c.blockId, itemId: c.itemId }, '已刪除');
    return;
  }
  if (t.classList.contains('vbtn')) return run('vendorProgress', { blockId: c.blockId, vendor: c.vendor, progress: t.dataset.p }, `${c.vendor || '未指定廠商'}：全部${t.dataset.p}`);
  if (t.classList.contains('upload')) return pickFile(c);
  if (t.classList.contains('fdel')) { if (confirm('刪除這個檔案？')) run('deleteFile', { blockId: c.blockId, vendor: c.vendor, fileId: t.dataset.file }, '已刪除檔案'); return; }
  if (t.classList.contains('gen')) return generate(b);
  if (t.classList.contains('share')) return openShare(b, 'progress');
  if (t.classList.contains('vshare')) return openShare(b, 'progress', c.vendor);
  if (t.classList.contains('archive')) {
    if (confirm(`把「${c.vendor || '未指定廠商'}」歸檔？\n歸檔後會移到「📚 歷史」，可以再取消歸檔。`))
      run('vendorArchive', { blockId: c.blockId, vendor: c.vendor, archived: true }, '已歸檔，可到「📚 歷史」查看');
    return;
  }
  if (t.classList.contains('unarchive')) return run('vendorArchive', { blockId: c.blockId, vendor: c.vendor, archived: false }, '已移回主畫面');
  if (t.classList.contains('b-del')) {
    if (b.status === 'generated') {
      if (confirm(`刪除 ${b.date}「${c.vendor || '未指定廠商'}」這張和裡面全部品項？`)) run('deleteVendor', { blockId: b.id, vendor: c.vendor || '' }, '已刪除');
    } else if (confirm(`刪除 ${b.date} 這張叫藥單？`)) run('deleteBlock', { id: b.id }, '已刪除叫藥單');
  }
});

// ======================== 新增品項（一步一步）========================
let W = null;
function openWizard(blockId, fixedVendor) { W = { blockId, fixedVendor, step: 'drug', drug: '', vendor: fixedVendor || '', qty: '', unit: '', known: null, edited: false }; showSheet('wiz'); drawWiz(); }
const fixedV = () => W.fixedVendor !== undefined;
function nextStep() {
  if (!W.vendor && !fixedV()) W.step = 'vendor';
  else if (W.step === 'vendor' || W.step === 'drug') W.step = 'qty';
  else if (W.step === 'qty') W.step = W.unit ? 'save' : 'unit';
  else W.step = 'save';
  if (W.step === 'save') return saveWiz();
  drawWiz();
}
function chooseDrug(name) {
  name = name.trim(); if (!name) return;
  const d = findDrug(name);
  W.drug = name; W.known = d || null;
  W.vendor = fixedV() ? W.fixedVendor : (d && d.vendor || ''); W.unit = d && d.unit || '';
  W.qty = d && d.qty !== null && d.qty !== undefined ? d.qty : '';
  W.step = (W.vendor || fixedV()) ? 'qty' : 'vendor';
  drawWiz();
}
function drawWiz() {
  const el = $('wiz'), blk = findBlock(W.blockId);
  const head = `<h2>新增品項 <span class="wiz-date">${esc(blk ? blk.date : '')}</span></h2>${W.drug ? `<div class="wiz-drug">${esc(W.drug)}</div>` : ''}`;
  const close = `<div class="actions"><button class="btn" data-close>完成</button></div>`;
  if (W.step === 'drug') {
    el.innerHTML = `${head}
      <input class="big" id="wDrug" placeholder="輸入藥品關鍵字，按 Enter" autocomplete="off" enterkeyhint="next">
      <div class="sugg" id="wSugg"></div>
      <p class="note">清單裡沒有的藥，按 Enter 就會自動加入，下次可以直接選。</p>${close}`;
    const inp = $('wDrug');
    const draw = () => {
      const q = inp.value.trim().toLowerCase();
      const list = S.drugs.filter(d => !q || d.name.toLowerCase().includes(q)).slice(0, 8);
      $('wSugg').innerHTML = list.map(d => `<button data-name="${esc(d.name)}">${esc(d.name)}<small>${esc([d.vendor, fmtQty(d.qty, d.unit)].filter(Boolean).join(' · '))}</small></button>`).join('')
        + (q && !findDrug(inp.value.trim()) ? `<button data-name="${esc(inp.value.trim())}">＋ 新增「${esc(inp.value.trim())}」</button>` : '');
    };
    inp.oninput = draw;
    inp.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); chooseDrug(inp.value); } };
    $('wSugg').onclick = e => { const b = e.target.closest('button'); if (b) chooseDrug(b.dataset.name); };
    draw(); setTimeout(() => inp.isConnected && inp.focus(), 50);
    return;
  }
  if (W.step === 'vendor' || W.step === 'unit') {
    const isV = W.step === 'vendor', list = isV ? S.lists.vendors : S.lists.units, cur = isV ? W.vendor : W.unit;
    el.innerHTML = `${head}<label class="lbl">${isV ? '選擇廠商' : '選擇單位'}</label>
      <div class="chips" id="wChips">${list.map(v => `<button class="chip${v === cur ? ' on' : ''}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>
      <input class="big" id="wNew" style="margin-top:12px" placeholder="${isV ? '或輸入新廠商' : '或輸入新單位'}，按 Enter" autocomplete="off">
      <div class="actions"><button class="btn" id="wBack">上一步</button></div>`;
    const pick = v => { v = v.trim(); if (!v) return; if (isV) W.vendor = v; else W.unit = v; if (W.known) W.edited = true; W.step = isV ? 'vendor' : 'unit'; nextStep(); };
    $('wChips').onclick = e => { const b = e.target.closest('.chip'); if (b) pick(b.dataset.v); };
    $('wNew').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); pick(e.target.value); } };
    $('wBack').onclick = () => { W.step = isV ? 'drug' : 'qty'; drawWiz(); };
    if (!list.length) setTimeout(() => $('wNew') && $('wNew').focus(), 50);
    return;
  }
  if (W.step === 'qty') {
    const changed = W.known && (W.unit !== (W.known.unit || '') || (!fixedV() && W.vendor !== (W.known.vendor || '')));
    el.innerHTML = `${head}
      <div class="summary">
        <button id="wEditV"${fixedV() ? ' disabled' : ''}>${esc(W.vendor || '未指定廠商')}${fixedV() ? '' : ' ✎'}</button>
        <button id="wEditU">${esc(W.unit || '未選單位')} ✎</button>
      </div>
      <label class="lbl">數量${W.unit ? '（' + esc(W.unit) + '）' : ''}</label>
      <input class="big" id="wQty" type="number" inputmode="decimal" min="0" step="any" value="${esc(W.qty)}" placeholder="輸入數量" enterkeyhint="done">
      <label class="lbl" style="display:block;margin-top:12px">需求備註（選填）</label>
      <input class="big" id="wNote" value="${esc(W.note || '')}" placeholder="備1" autocomplete="off" enterkeyhint="done">
      ${W.known ? `<label class="check"><input type="checkbox" id="wDef" ${changed || W.edited ? 'checked' : ''}> 把這次的廠商／數量／單位設為「${esc(W.drug)}」的預設</label>` : ''}
      <div class="actions"><button class="btn" id="wBack">上一步</button><button class="btn primary" id="wOk">加入</button></div>`;
    const keep = () => { W.qty = $('wQty').value; W.note = $('wNote').value; };
    const go = () => { keep(); W.setDefault = $('wDef') ? $('wDef').checked : true; nextStep(); };
    $('wQty').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
    $('wNote').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); } };
    $('wOk').onclick = go;
    $('wBack').onclick = () => { W.step = 'drug'; drawWiz(); };
    $('wEditV').onclick = () => { keep(); W.step = 'vendor'; drawWiz(); };
    $('wEditU').onclick = () => { keep(); W.step = 'unit'; drawWiz(); };
    setTimeout(() => { const q = $('wQty'); if (q) { q.focus(); q.select(); } }, 50);
  }
}
let wizBusy = false;
async function saveWiz() {
  if (wizBusy) return;          // 避免連點重複加入
  wizBusy = true;
  const sheet = $('wiz');
  sheet.querySelectorAll('button, input').forEach(x => x.disabled = true);
  const box = document.createElement('p'); box.className = 'adding'; box.textContent = `⏳ 正在加入「${W.drug}」…`;
  sheet.appendChild(box);
  try { await saveWizNow(); } finally { wizBusy = false; }
}
async function saveWizNow() {
  const item = { drug: W.drug, vendor: W.vendor, qty: W.qty, unit: W.unit, note: W.note || '' };
  const j = await run('addItem', { blockId: W.blockId, item, setDefault: !!W.setDefault });
  if (j) {
    toast(`已加入 ${W.drug}`);
    W = { blockId: W.blockId, fixedVendor: W.fixedVendor, step: 'drug', drug: '', vendor: W.fixedVendor || '', qty: '', unit: '', known: null, edited: false };
    drawWiz(); // 留在視窗，可以繼續加下一項
  } else { W.step = 'qty'; drawWiz(); }
}

// ======================== 生成 + 分享 ========================
async function generate(b) {
  if (!confirm(`生成 ${b.date} 的叫藥清單（${b.items.length} 項）？`)) return;
  const j = await run('generate', { blockId: b.id });
  if (j && j.shareBlock) openShare(j.shareBlock);
}
// openExternalBrowser=1：從 LINE 點連結會直接用 Safari / Chrome 開，不用 LINE 內建瀏覽器
function appUrl(b) { return location.origin + location.pathname + '?date=' + encodeURIComponent(b.date) + '&openExternalBrowser=1'; }
function shareText(b) {
  const lines = [`${String(b.date).slice(5)} 需要調貨`];
  let n = 0; // 編號跨廠商連續
  groups(b).forEach(g => {
    lines.push(`【${g.vendor || '未指定廠商'}】`);
    g.items.forEach(it => lines.push(`${++n}. ${it.drug}　需要 ${fmtQty(it.orderQty ?? it.qty, it.orderUnit || it.unit)}${it.note ? '（' + it.note + '）' : ''}`));
  });
  return lines.join('\n');
}
const ICON = { '已訂貨': '✅', '已調貨': '☑️', '缺藥': '⚠️', '其他': '❕' };
function nowStr() { const d = new Date(), p = n => String(n).padStart(2, '0'); return { date: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`, time: `${p(d.getHours())}:${p(d.getMinutes())}` }; }
function progressText(b, vendor, start = 0) {
  const gs = vendor === undefined ? liveGroups(b) : groups(b).filter(g => g.vendor === vendor);
  const n = gs.reduce((s, g) => s + g.items.length, 0), now = nowStr();
  const when = now.date === b.date ? `${b.date} ${now.time}` : `${b.date}（${now.date} ${now.time} 更新）`;
  const lines = [];
  const SHORT = { '已訂貨': '已訂', '已調貨': '已調', '缺藥': '缺藥', '其他': '其他' };
  let k = start; // 編號跨廠商連續，和卡片上的編號一樣
  gs.forEach(g => {
    lines.push(`【${g.vendor || '未指定廠商'}】`);
    g.items.forEach(it => {
      if (it.progress === '其他') { // 其他：只放 ❕ + 備2 的文字
        lines.push(`${++k}. ${it.drug}　❕${it.progressNote ? '（' + it.progressNote + '）' : '其他'}`);
        return;
      }
      const st = it.progress ? ICON[it.progress] + ' ' + SHORT[it.progress] : '⏳ 未處理';
      const qty = it.progress === '缺藥' ? '' : ' ' + fmtQty(it.orderQty ?? it.qty, it.orderUnit || it.unit);
      lines.push(`${++k}. ${it.drug}　${st}${qty}${it.progressNote ? '（' + it.progressNote + '）' : ''}`);
    });
  });
  return lines.join('\n');
}
// 這一天所有（未歸檔）廠商卡 → 一份叫藥清單
function shareDay(date, mode = 'list') {
  const items = [];
  dayCards(date).forEach(c => items.push(...c.g.items));
  if (!items.length) return toast('這天沒有可分享的品項');
  openShare({ date, items, vendors: {}, generatedBy: me }, mode);
}
function openShare(b, mode, vendor) {
  const prog = mode === 'progress';
  const start = prog && vendor !== undefined ? cardStart(b, vendor) : 0;
  const text = prog ? progressText(b, vendor, start) : shareText(b);
  $('shareTitle').textContent = prog ? (vendor === undefined ? '叫貨進度' : `叫貨進度：${vendor || '未指定廠商'}`) : '叫藥清單已生成 🎉';
  $('shareSub').textContent = prog ? '分享到 LINE 群組，讓大家知道處理到哪了。' : '分享到 LINE 群組。';
  $('shareText').textContent = text;
  $('lineBtn').href = 'https://line.me/R/share?text=' + encodeURIComponent(text);
  $('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(text); toast('已複製，可以貼到 LINE'); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($('shareText')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('請長按選取的文字複製'); }
  };
  showSheet('shareSheet');
}

// ======================== 文字輸入視窗（其他進度）========================
let askCb = null;
function askText(title, value, ok, cancel) {
  $('askTitle').textContent = title; $('askInput').value = value || '';
  askCb = { ok, cancel };
  showSheet('askSheet');
  setTimeout(() => $('askInput').focus(), 60);
}
function askDone(confirmed) {
  const cb = askCb; askCb = null;
  const v = $('askInput').value.trim();
  closeSheets();
  if (!cb) return;
  if (confirmed) cb.ok(v); else cb.cancel && cb.cancel();
}
$('askOk').onclick = () => askDone(true);
$('askNo').onclick = () => askDone(false);
$('askInput').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); askDone(true); } };

// ======================== 貨單上傳 ========================
let upCtx = null;
function pickFile(c) { upCtx = c; $('fileInput').value = ''; $('fileInput').click(); }
$('fileInput').onchange = async () => {
  const f = $('fileInput').files[0]; if (!f || !upCtx) return;
  const c = upCtx; upCtx = null;
  try {
    toast('上傳中…');
    let blob = f, name = f.name || '貨單';
    if (f.type.startsWith('image/')) { blob = await shrinkImage(f); name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
    if (blob.size > 20 * 1024 * 1024) throw new Error('檔案太大（上限約 20MB）');
    const data = await toBase64(blob);
    const vName = c.vendor || '未指定廠商', b = findBlock(c.blockId);
    await api('upload', { blockId: c.blockId, vendor: c.vendor, name: `${b ? b.date : ''}_${vName}_${name}`, mime: blob.type || f.type, data });
    toast('貨單已上傳');
  } catch (e) { toast(e.message || '上傳失敗'); }
};
function toBase64(blob) {
  return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
}
function shrinkImage(file, max = 1800) {
  return new Promise(ok => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => ok(b || file), 'image/jpeg', .82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(file); };
    img.src = url;
  });
}

// ======================== 設定 ========================
let setTab = 'drugs';
function openSettings(tab, msg) { setTab = tab || setTab; showSheet('setSheet'); drawSettings(msg); }
$('setBtn').onclick = () => openSettings('drugs');
$('meBtn').onclick = () => openSettings('me');
function drawSettings(msg) {
  const el = $('setSheet');
  const tabs = [['drugs', '藥品'], ['vendors', '廠商'], ['units', '單位'], ['staff', '人員'], ['me', '我的設定']];
  let body = '';
  if (setTab === 'me') {
    body = `${msg ? `<p class="sub" style="color:var(--danger)">${esc(msg)}</p>` : ''}
      <label class="lbl">我的名字（處理進度會顯示這個名字）</label>
      <input class="big" id="sName" value="${esc(me)}" maxlength="12" placeholder="例如：小楊">
      <label class="lbl" style="display:block;margin-top:12px">團隊密碼</label>
      <input class="big" id="sPass" value="${esc(pass)}" type="password" autocomplete="off" placeholder="問管理者">
      <div class="actions"><button class="btn primary" id="sSave">儲存</button></div>`;
  } else if (setTab === 'drugs') {
    body = `<input class="big" id="dSearch" placeholder="搜尋或新增藥品，按 Enter" autocomplete="off" enterkeyhint="done">
      <div id="dList" style="margin-top:10px"></div>
      <p class="note">輸入新藥名按 Enter 就會加入清單，再設定它的預設廠商、數量、單位（修改後自動儲存）。</p>`;
  } else {
    const label = { vendors: '廠商', units: '單位', staff: '人員' }[setTab];
    body = `<div class="chips" id="lChips">${(S.lists[setTab] || []).map(v => `<span class="chip">${esc(v)}<button class="rm icon" data-v="${esc(v)}" aria-label="移除">×</button></span>`).join('') || `<span class="note">還沒有${label}</span>`}</div>
      <input class="big" id="lNew" style="margin-top:12px" placeholder="新增${label}，按 Enter" autocomplete="off">`;
  }
  el.innerHTML = `<h2>設定 <span class="ver">版本 ${APP_VERSION}</span></h2><div class="tabs">${tabs.map(([k, n]) => `<button data-tab="${k}" class="${k === setTab ? 'on' : ''}">${n}</button>`).join('')}</div>
    ${body}<div class="actions"><button class="btn" data-close>關閉</button></div>`;
  el.querySelector('.tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { setTab = b.dataset.tab; drawSettings(); } };

  if (setTab === 'me') {
    $('sSave').onclick = async () => {
      const n = $('sName').value.trim(), p = $('sPass').value.trim();
      if (!n || !p) return toast('名字和密碼都要填');
      me = n; pass = p; store.set('name', n); store.set('pass', p); showMe();
      const ok = await load();
      if (ok) { closeSheets(); toast('已儲存'); }
    };
  } else if (setTab === 'drugs') {
    const draw = () => {
      const q = $('dSearch').value.trim().toLowerCase();
      const list = S.drugs.filter(d => !q || d.name.toLowerCase().includes(q));
      const raw = $('dSearch').value.trim();
      const addBtn = raw && !findDrug(raw) ? `<button class="btn ghost dAdd" style="width:100%;margin-bottom:8px">＋ 新增「${esc(raw)}」</button>` : '';
      $('dList').innerHTML = addBtn + list.map(d => `<div class="drow" data-name="${esc(d.name)}">
          <div class="it-top"><input class="f dN" value="${esc(d.name)}" aria-label="藥品名稱" autocomplete="off"><button class="x dDel" aria-label="刪除藥品">×</button></div>
          <div class="ctrls">
            <select class="f dV">${opts(S.lists.vendors, d.vendor, '預設廠商')}</select>
            <input class="f dQ" type="number" inputmode="decimal" min="0" step="any" value="${d.qty ?? ''}" placeholder="數量">
            <select class="f dU">${opts(S.lists.units, d.unit, '單位')}</select>
          </div></div>`).join('') + (list.length || addBtn ? '' : '<p class="note">還沒有藥品，在上面輸入藥名按 Enter 新增</p>');
    };
    const addDrug = async () => {
      const name = $('dSearch').value.trim();
      if (!name || findDrug(name)) return;
      const j = await run('saveDrug', { drug: { name, vendor: '', qty: '', unit: '' } }, `已新增 ${name}，請設定預設值`);
      if (j) { draw(); }
    };
    $('dSearch').oninput = draw; draw();
    $('dSearch').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addDrug(); } };
    $('dList').onchange = e => {
      const row = e.target.closest('.drow'); if (!row) return;
      const newName = row.querySelector('.dN').value.trim();
      if (!newName) { row.querySelector('.dN').value = row.dataset.name; return toast('藥品名稱不能空白'); }
      run('saveDrug', { oldName: row.dataset.name, drug: { name: newName, vendor: row.querySelector('.dV').value, qty: row.querySelector('.dQ').value, unit: row.querySelector('.dU').value } },
        newName !== row.dataset.name ? '已改名' : '已更新預設').then(j => { if (j) { row.dataset.name = newName; } else draw(); });
    };
    $('dList').onclick = async e => {
      if (e.target.closest('.dAdd')) return addDrug();
      const b = e.target.closest('.dDel'); if (!b) return;
      const name = b.closest('.drow').dataset.name;
      if (confirm(`從清單刪除「${name}」？（已經叫過的紀錄不受影響）`)) { await run('deleteDrug', { name }, '已刪除'); draw(); }
    };
  } else {
    const save = async list => { await run('saveLists', { lists: { [setTab]: list } }); drawSettings(); render(); };
    $('lChips').onclick = e => { const b = e.target.closest('.rm'); if (b) save(S.lists[setTab].filter(v => v !== b.dataset.v)); };
    $('lNew').onkeydown = e => {
      if (e.key !== 'Enter' || e.isComposing) return;
      const v = e.target.value.trim(); if (!v) return;
      save([...(S.lists[setTab] || []), v]);
    };
    setTimeout(() => $('lNew') && $('lNew').focus(), 50);
  }
}
function showMe() { $('meBtn').textContent = '👤 ' + (me || '設定名字'); }
function ready() { if (!me || !pass) { openSettings('me', '先設定名字和團隊密碼'); return false; } return true; }

// ======================== 手機鍵盤 ========================
(function () {
  const vv = window.visualViewport; if (!vv) return;
  const fit = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
    document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
})();

// ======================== 彈窗 / 提示 ========================
function showSheet(id) { closeSheets(true); $('overlay').classList.add('open'); $(id).classList.add('open'); }
function closeSheets(keepOverlay) {
  document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
  if (!keepOverlay) $('overlay').classList.remove('open');
  if (!keepOverlay && W) { W = null; }
}
$('overlay').onclick = () => { if (askCb) return askDone(false); closeSheets(); };
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheets(); });
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), m.length > 18 ? 4500 : 2400); }

// ======================== 載入 ========================
let firstLoad = true;
async function load(quiet) {
  if (typeof API_URL === 'undefined' || !API_URL.startsWith('https://')) { $('list').innerHTML = '<div class="empty">請先在 config.js 填入 API_URL（並和 index.html 放在同一個資料夾）</div>'; return false; }
  if (!me || !pass) { if (!quiet) openSettings('me', '先設定名字和團隊密碼'); return false; }
  if (queued > 0) { setTimeout(() => load(true), 1500); return true; } // 還有修改在存，等一下再抓
  const btn = $('refresh'); btn.classList.add('spin');
  try {
    await api('init');
    if (firstLoad) { firstLoad = false; jumpToLinked(); }
    return true;
  } catch (e) {
    if (!quiet) toast(e.message);
    if (!S.blocks.length) $('list').innerHTML = `<div class="empty">載入失敗：${esc(e.message)}</div>`;
    return false;
  } finally { btn.classList.remove('spin'); }
}
function jumpToLinked() {
  const q = new URLSearchParams(location.search), id = q.get('id'), date = q.get('date');
  if (date) {
    const day = document.querySelector(`.day[data-date="${CSS.escape(date)}"]`);
    if (!day) return toast('這天的叫藥單可能已經全部歸檔');
    setTimeout(() => { day.scrollIntoView({ behavior: 'smooth', block: 'start' }); day.querySelectorAll('.block').forEach(e => e.classList.add('flash')); }, 150);
    return;
  }
  if (!id) return;
  const els = document.querySelectorAll(`.block[data-id="${CSS.escape(id)}"]`);
  if (!els.length) return toast('找不到這張叫藥單，可能已歸檔或刪除');
  setTimeout(() => { els[0].scrollIntoView({ behavior: 'smooth', block: 'start' }); els.forEach(e => e.classList.add('flash')); }, 150);
}
$('refresh').onclick = async () => { if (await load()) toast('已重新整理'); };

// 自動更新：畫面在前景、沒有在輸入、沒開視窗時，每 40 秒抓一次
function idle() {
  const a = document.activeElement;
  return !document.hidden && !document.querySelector('.sheet.open') && !(a && a.closest && a.closest('#list') && a.matches('input,select,textarea'));
}
setInterval(() => { if (idle() && pending === 0) load(true); }, 40000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && idle()) load(true); });

showMe();
load();
