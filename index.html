<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="叫藥調貨">
<meta name="theme-color" content="#314448">
<title>叫藥調貨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ☀️ 山嵐 */
  :root {
    --font: -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --bg: #EEF0E6; --surface: #FDFDF8; --surface2: #F3F5EC; --line: #D4DCCD;
    --ink: #1C2826; --drug: #22302C; --muted: #3E4C49;
    --accent: #536D6C; --on-accent: #FFFFFF;
    --header: linear-gradient(135deg, #314448 0%, #536D6C 55%, #7C9A92 100%); --header-ink: #FFFFFF;
    --title: linear-gradient(90deg, #FFFFFF 0%, #E0DAB8 60%, #C7D3BF 100%);
    --vendor: #E0DAB8; --vendor-ink: #314448;
    --danger: #B23B3B;
    --p-已訂貨: #3F74B5; --p-已調貨: #3F9156; --p-缺藥: #C94F4F; --p-其他: #7A5BB0;
    --card-shadow: 0 1px 2px rgba(20,40,40,.06), 0 4px 14px rgba(20,40,40,.07);
    color-scheme: light;
  }
  /* 🌙 深海藍 */
  :root[data-theme="dark"] {
    --bg: #01183A; --surface: #022B5A; --surface2: #013066; --line: #0C3F78;
    --ink: #EEF4F9; --drug: #FFFFFF; --muted: #BFD2E0;
    --accent: #6497B1; --on-accent: #011F4B;
    --header: linear-gradient(135deg, #011F4B 0%, #03396C 50%, #005B96 100%); --header-ink: #E3EDF5;
    --title: linear-gradient(90deg, #FFFFFF 0%, #B3CDE0 55%, #6497B1 100%);
    --vendor: #03396C; --vendor-ink: #E3EDF5;
    --danger: #FF8A8A;
    --p-已訂貨: #6FB6FF; --p-已調貨: #5FD08A; --p-缺藥: #FF7A7A; --p-其他: #C9A8FF;
    --card-shadow: none;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* 頂部 */
  header {
    position: sticky; top: 0; z-index: 5; background: var(--header); color: var(--header-ink);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
  }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; max-width: 760px; margin: 0 auto; }
  h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .06em;
    background: var(--title); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hbtns { display: flex; align-items: center; gap: 6px; }
  .hbtn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25); color: var(--header-ink);
    border-radius: 999px; padding: 4px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
  .hbtn svg { width: 15px; height: 15px; }
  .hbtn.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .theme-toggle { position: relative; width: 52px; height: 28px; flex: none; padding: 0; border-radius: 999px;
    border: 1px solid #2B2B2B; background: #2B2B2B; transition: background-color .3s; }
  .theme-toggle .knob { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; background: #fff; color: #1A1A1A; transition: transform .3s cubic-bezier(.4,1.3,.6,1), background-color .3s; }
  .theme-toggle svg { width: 14px; height: 14px; }
  .theme-toggle .moon { display: none; }
  :root[data-theme="dark"] .theme-toggle { background: #fff; border-color: #D9D9D9; }
  :root[data-theme="dark"] .theme-toggle .knob { transform: translateX(24px); background: #111; color: #fff; }
  :root[data-theme="dark"] .theme-toggle .sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .moon { display: block; }

  main { max-width: 760px; margin: 0 auto; padding: 12px 12px calc(110px + env(safe-area-inset-bottom, 0px)); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }

  /* 大 block */
  .block { background: var(--surface); border-radius: 16px; box-shadow: var(--card-shadow); border: 1px solid var(--line);
    margin: 0 0 16px; overflow: hidden; scroll-margin-top: 90px; }
  .block.flash { animation: flash 2.2s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--card-shadow); } }
  .b-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .b-date { font-weight: 700; font-size: 17px; color: var(--drug); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--surface2); }
  .b-date-txt { font-weight: 700; font-size: 17px; color: var(--drug); }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .badge.draft { background: var(--surface2); color: var(--muted); border: 1px dashed var(--line); }
  .badge.gen { background: var(--accent); color: var(--on-accent); }
  .b-meta { font-size: 13px; color: var(--muted); flex: 1; }
  .icon { background: none; border: 0; color: var(--muted); padding: 4px 6px; font-size: 18px; line-height: 1; border-radius: 8px; }

  /* 廠商小 block */
  .vgroup { margin: 10px 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .v-title { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
    background: var(--vendor); color: var(--vendor-ink); font-weight: 700; }
  .v-title small { font-weight: 500; opacity: .75; }
  .item { padding: 10px 12px; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .it-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .it-drug { font-weight: 700; color: var(--drug); word-break: break-word; }
  .orig { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ctrls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .f { border: 1px solid var(--line); border-radius: 8px; background: var(--surface2); padding: 6px 8px; font-size: 16px; min-width: 0; }
  input.f[type=number] { width: 78px; }
  select.f { max-width: 160px; }
  .lbl { font-size: 12px; color: var(--muted); }
  .by { font-size: 12px; color: var(--muted); }
  .x { background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; margin-left: auto; }
  select.prog { font-weight: 700; }
  select.prog[data-p="已訂貨"] { color: var(--p-已訂貨); border-color: var(--p-已訂貨); }
  select.prog[data-p="已調貨"] { color: var(--p-已調貨); border-color: var(--p-已調貨); }
  select.prog[data-p="缺藥"] { color: var(--p-缺藥); border-color: var(--p-缺藥); }
  select.prog[data-p="其他"] { color: var(--p-其他); border-color: var(--p-其他); }
  .v-foot { padding: 10px 12px; background: var(--surface2); border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chipbtn { border: 1.5px solid var(--c, var(--line)); color: var(--c, var(--ink)); background: var(--surface);
    border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
  .files a { color: var(--accent); font-size: 14px; word-break: break-all; }
  .files div { display: flex; gap: 6px; align-items: center; font-size: 13px; }

  .b-foot { display: grid; gap: 8px; padding: 4px 12px 14px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px; font-size: 16px; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .btn.ghost { border-style: dashed; color: var(--accent); }
  .btn.line { background: #06C755; border-color: #06C755; color: #fff; font-weight: 700; }
  .btn:disabled { opacity: .5; }

  .fab { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 728px; margin: 0 auto;
    background: var(--accent); color: var(--on-accent); border: 0; border-radius: 14px; padding: 15px; font-size: 17px; font-weight: 700;
    letter-spacing: .04em; box-shadow: 0 8px 22px rgba(0,0,0,.22); z-index: 4; }

  /* 彈出視窗 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
  .overlay.open { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 760px; margin: 0 auto; max-height: 92%;
    overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: none; }
  .sheet.open { display: block; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sheet.open, .block.flash { animation: none; } }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; color: var(--drug); }
  .sheet .sub { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
  .big { width: 100%; padding: 13px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); font-size: 18px; }
  .sugg { display: grid; gap: 6px; margin-top: 8px; }
  .sugg button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
  .sugg small { color: var(--muted); margin-left: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 15px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .chip .rm { margin-left: 6px; opacity: .6; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .summary button { border: 1px dashed var(--line); background: var(--surface2); border-radius: 8px; padding: 4px 10px; font-size: 14px; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions .btn { flex: 1; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 14px; color: var(--muted); }
  pre.share { white-space: pre-wrap; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; font-size: 14px; font-family: var(--font); max-height: 40vh; overflow: auto; margin: 0; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
  .tabs button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .tabs button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .drow { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .drow .it-drug { margin-bottom: 4px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    z-index: 40; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 15px;
    display: none; max-width: 90%; text-align: center; }
  .toast.show { display: block; }
  .saving { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 50; background: var(--accent);
    transform-origin: left; animation: load 1.2s ease-in-out infinite; display: none; }
  .saving.on { display: block; }
  @keyframes load { 0% { transform: scaleX(0); } 60% { transform: scaleX(.8); } 100% { transform: scaleX(1); opacity: 0; } }

  /* ===== 大字版（方便視力不好的同事）===== */
  body { font-size: 18px; }
  h1 { font-size: 24px; white-space: nowrap; flex: none; }
  .hbtn { font-size: 15px; padding: 6px 10px; white-space: nowrap; min-height: 36px; }
  #meBtn { max-width: 120px; overflow: hidden; text-overflow: ellipsis; display: inline-block; }
  .hbtns { gap: 5px; min-width: 0; }
  .b-date, .b-date-txt { font-size: 20px; }
  .badge { font-size: 14px; padding: 3px 10px; }
  .b-meta { font-size: 15px; }
  .v-title { font-size: 19px; padding: 10px 14px; }
  .v-title small { font-size: 15px; }
  .item { padding: 12px 14px; }
  .it-drug { font-size: 19px; }
  .orig { font-size: 15px; }
  .f { font-size: 18px; padding: 8px 10px; min-height: 44px; }
  input.f[type=number] { width: 92px; }
  select.f { max-width: 190px; }
  .lbl, .by { font-size: 15px; }
  .x { font-size: 26px; min-width: 44px; min-height: 44px; }
  .chipbtn { font-size: 16px; padding: 9px 14px; min-height: 44px; }
  .files a, .files div { font-size: 16px; }
  .btn { font-size: 18px; padding: 13px; min-height: 50px; }
  .fab { font-size: 19px; padding: 17px; }
  .sheet h2 { font-size: 21px; }
  .sheet .sub, .note, .check { font-size: 16px; }
  .big { font-size: 20px; padding: 14px; }
  .sugg button { font-size: 18px; padding: 12px 14px; min-height: 48px; }
  .sugg small { font-size: 15px; }
  .chip { font-size: 19px; padding: 11px 18px; min-height: 48px; min-width: 56px; cursor: pointer; }
  .chip:active { transform: scale(.96); }
  .summary button { font-size: 17px; padding: 8px 12px; }
  .tabs button { font-size: 17px; padding: 8px 14px; }
  pre.share { font-size: 16px; }
  .toast { font-size: 17px; padding: 12px 18px; }
  .adding { margin-top: 14px; text-align: center; font-size: 18px; font-weight: 700; color: var(--accent); }
  button:disabled { opacity: .5; }
  /* 提示文字（placeholder）一律淺灰、細 */
  :root { --ph: #A3ADAA; } :root[data-theme="dark"] { --ph: #6F86A0; }
  .big::placeholder, .f::placeholder, input::placeholder { color: var(--ph) !important; font-weight: 400 !important; opacity: 1; }
  .ver { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 8px; }
  /* 清楚好讀的新增視窗 */
  .wiz-date { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .wiz-drug { font-size: 22px; font-weight: 700; color: var(--drug); margin: 6px 0 12px; word-break: break-word; }
  .summary button { border: 2px solid var(--accent); background: var(--surface); color: var(--drug); font-weight: 700; font-size: 18px; padding: 8px 14px; border-radius: 10px; }
  .summary button:disabled { opacity: 1; border-style: solid; border-color: var(--line); }
  .lbl { color: var(--ink); font-weight: 500; }
  .big { color: var(--ink); font-weight: 700; border-width: 2px; }
  .big::placeholder { color: var(--muted); font-weight: 400; }
  /* 更粗、更好讀 */
  body { font-weight: 500; }
  .sugg button { font-weight: 700; color: var(--drug); border-width: 2px; }
  .sugg small { font-weight: 600; color: var(--ink); margin-left: 8px; }
  .note, .sheet .sub { font-weight: 600; color: var(--ink); }
  .big::placeholder { font-weight: 500; }
  .f { font-weight: 600; }
  /* 草稿：淺綠底 */
  .block.is-draft { background: #DFF0D5; border-color: #B9D9A8; }
  .block.is-draft .b-head { border-color: #C6DFBA; }
  .block.is-draft .vgroup { background: #F4FAF0; border-color: #C6DFBA; }
  .block.is-draft .item { border-color: #D5E8CB; }
  :root[data-theme="dark"] .block.is-draft { background: #0B3A3E; border-color: #1F5A55; }
  :root[data-theme="dark"] .block.is-draft .b-head, :root[data-theme="dark"] .block.is-draft .item { border-color: #1F5A55; }
  :root[data-theme="dark"] .block.is-draft .vgroup { background: #0E4448; border-color: #1F5A55; }
  /* 草稿品項：藥名、數量、單位、廠商、刪除 同一行 */
  .draft-row { display: flex; align-items: center; gap: 8px; }
  .draft-row .it-drug { flex: 1 1 0; min-width: 0; }
  .d-ctrls { display: grid; grid-template-columns: 76px 78px minmax(96px, 130px) 36px; gap: 6px; align-items: center; flex: none; }
  .d-ctrls .f { width: 100% !important; max-width: none; padding-left: 6px; padding-right: 4px; }
  .d-ctrls .x { min-width: 36px; min-height: 36px; padding: 0; margin: 0; font-size: 22px; }
  .head-x { display: none; }
  @media (max-width: 640px) { /* 手機：藥名 + × 在上，其他同一行 */
    .draft-row { flex-wrap: wrap; }
    .draft-row .it-drug { flex: 1 1 0; }
    .head-x { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; min-height: 40px; margin: -6px -6px 0 0; font-size: 26px; padding: 0; }
    .d-ctrls .del, .g-ctrls .del { display: none; }
    .d-ctrls { grid-template-columns: 0.9fr 1fr 1.5fr; width: 100%; }
    .g-ctrls { grid-template-columns: 1.4fr 0.9fr 1fr auto !important; width: 100%; }
    /* iPhone 下拉的上下箭頭很佔位 → 換成小箭頭 */
    select.f { -webkit-appearance: none; appearance: none; padding-right: 22px !important;
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: calc(100% - 13px) 55%, calc(100% - 8px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid2 .chipbtn { padding: 9px 4px; font-size: 16px; white-space: nowrap; }
  @media (min-width: 620px) { .grid2 { grid-template-columns: repeat(4, 1fr); } }
  .line-chip { background: #06C755; border-color: #06C755; color: #fff; }
  .v-title { flex-wrap: wrap; gap: 6px; }
  .v-right { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .v-right .f { font-size: 15px; min-height: 38px; padding: 4px 6px; max-width: 170px; background: var(--surface); }
  .v-right .chipbtn { font-size: 15px; min-height: 38px; padding: 4px 12px; }
  body.hist .fab { display: none; }
  .hist-h { margin: 4px 4px 12px; font-size: 20px; color: var(--drug); }
  .hist-card .v-title .chipbtn { font-size: 14px; min-height: 36px; padding: 4px 10px; }
  .h-item { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 10px; align-items: baseline; padding: 10px 14px; border-top: 1px solid var(--line); }
  .h-item .by { grid-column: 3; text-align: right; }
  .h-item .h-p { font-weight: 700; }
  /* 草稿：左邊直排「草稿」草綠色 */
  .block.is-draft { display: flex; }
  .draft-tag { flex: none; width: 36px; background: #4E9A3A; color: #fff; font-weight: 700; font-size: 18px;
    display: flex; align-items: center; justify-content: center; padding: 12px 0; }
  .draft-tag span { line-height: 1.5; text-align: center; }
  .draft-main { flex: 1; min-width: 0; }
  /* 日期分組 */
  .day { margin: 0 0 22px; }
  .day-h { position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); z-index: 3; display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 10px; padding: 8px 14px; border-radius: 12px; background: var(--accent); color: var(--on-accent);
    font-size: 20px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .day-h small { font-size: 15px; font-weight: 500; opacity: .85; margin-left: 8px; }
  .day-h { justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .day-share { border: 1.5px solid rgba(255,255,255,.7); background: rgba(255,255,255,.16); color: inherit;
    border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .day-h { flex-wrap: nowrap; gap: 8px; }
  .dshort { display: none; }
  .day-btns { display: flex; gap: 6px; flex: none; }
  .day-prog { border: 1.5px solid #06C755; background: #06C755; color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .day-h > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (max-width: 480px) {
    .day-h { font-size: 17px; padding: 7px 10px; }
    .day-h small { display: none; }
    .day-share, .day-prog { font-size: 14px; padding: 5px 9px; }
    .day-share .long, .dlong { display: none; }
    .dshort { display: inline !important; }
  }
  .day .block { margin-bottom: 12px; }
  /* 已生成：每個廠商一張卡 */
  .block.is-gen .vcard-title { border-radius: 0; }
  .vt-name { font-size: 20px; font-weight: 700; display: flex; flex-direction: column; }
  .vt-name small { font-size: 14px; font-weight: 500; opacity: .75; }
  .vcard-title .v-right { flex-wrap: wrap; justify-content: flex-end; }
  .vcard-title .icon { font-size: 20px; }
  .block.is-gen .v-foot { border-top: 1px solid var(--line); }
  .block.is-gen .v-foot .add-item { margin-top: 2px; }
  /* 已生成品項同一行：藥名｜進度｜叫貨量｜單位｜需求｜× */
  .g-ctrls { display: grid; grid-template-columns: 112px 70px 74px minmax(64px, auto) 36px; gap: 6px; align-items: center; flex: none; }
  .g-ctrls .f { width: 100% !important; max-width: none; padding-left: 6px; padding-right: 4px; }
  .g-ctrls .x { min-width: 36px; min-height: 36px; padding: 0; margin: 0; font-size: 22px; }
  .g-note { font-size: 13px; color: var(--muted); line-height: 1.25; }
  @media (max-width: 640px) {
    .gen-line { flex-wrap: wrap; }
    .gen-line .it-drug { flex: 1 1 0; }
    .g-ctrls { width: 100%; grid-template-columns: 1.5fr 1fr 1fr auto 32px; }
    .vcard-title .v-right { width: 100%; display: grid; grid-template-columns: 1.3fr 1fr auto auto; }
    .vcard-title .v-right .f { max-width: none; }
  }
  .note-in { width: 100%; margin-top: 6px; font-size: 16px; font-weight: 500; flex-basis: 100%; }
  .draft-row { flex-wrap: wrap; }
  /* 廠商名：左邊直排 */
  .block.is-gen, .side-group { display: flex; }
  .v-side { flex: none; width: 40px; background: var(--vendor); color: var(--vendor-ink); font-weight: 700; font-size: 19px;
    display: flex; align-items: center; justify-content: center; padding: 12px 0; border-right: 1px solid var(--line); }
  .v-side span { line-height: 1.3; text-align: center; word-break: break-all; font-size: 19px; }
  .v-main { flex: 1; min-width: 0; }
  .side-group .item:first-child { border-top: 0; }
  .block.is-gen .vcard-title { padding: 8px 10px; background: var(--surface2); color: var(--ink); }
  .vt-name small { font-size: 15px; opacity: 1; color: var(--muted); }
  /* 已生成卡：左側欄放廠商名＋三個按鈕 */
  .gen-side { width: 64px; flex-direction: column; justify-content: flex-start; gap: 8px; padding: 10px 5px; }
  .gen-side .vs-name { font-size: 19px; line-height: 1.3; text-align: center; margin-bottom: 4px; }
  .sbtn { width: 100%; border: 1.5px solid var(--c, var(--line)); color: var(--c, var(--ink)); background: var(--surface);
    border-radius: 10px; padding: 6px 0; font-size: 14px; font-weight: 700; line-height: 1.25; }
  .sbtn.line-chip { background: #06C755; border-color: #06C755; color: #fff; }
  .vcard-title { flex-direction: column; align-items: stretch !important; gap: 6px; }
  .vcard-title .vt-name { flex-direction: row; justify-content: space-between; align-items: center; }
  .t-row { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px; align-items: center; }
  .t-row .f { width: 100%; max-width: none; min-height: 40px; font-size: 16px; background: var(--surface); }
  .by-lbl { font-size: 13px; color: var(--muted); font-weight: 500; }
  .t-stack { display: flex; flex-direction: column; gap: 4px; }
  .t-stack .chipbtn { font-size: 14px; min-height: 34px; padding: 3px 10px; white-space: nowrap; }
  .block.is-gen .v-foot { padding: 8px 10px; }
  .notes2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; flex-basis: 100%; margin-top: 6px; }
  .notes2 .note-in { margin-top: 0; }
  .notes2 .f { width: 100%; font-size: 16px; font-weight: 500; }
  .it-no { color: var(--accent); margin-right: 6px; }
  .drow .dN { flex: 1; font-weight: 700; color: var(--drug); }
  .gen-row { display: grid; grid-template-columns: minmax(64px, 1fr) minmax(64px, 1fr) minmax(104px, 1.5fr); gap: 6px; margin-top: 8px; }
  .gen-row .f { width: 100% !important; max-width: none; }
  .by-r { text-align: right; margin-top: 2px; }
  .x.sm { min-width: 36px; min-height: 36px; margin-left: 0; font-size: 22px; padding: 0; }
  .it-top { align-items: center; }
  .it-top .it-drug { flex: 1; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .row3 .chipbtn { padding: 9px 4px; font-size: 15px; white-space: nowrap; }
  .row2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 6px; }
  .row2 .f { width: 100%; max-width: none; }
</style>
</head>
<body>
<div class="saving" id="saving"></div>

<header>
  <div class="hrow">
    <h1>叫藥調貨</h1>
    <div class="hbtns">
      <button class="hbtn" id="histBtn">📚 歷史</button>
      <button class="hbtn" id="meBtn"></button>
      <button class="hbtn" id="setBtn" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="hbtn" id="refresh" aria-label="重新整理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="theme-toggle" id="themeBtn" aria-label="切換深淺色"><span class="knob">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>
      </span></button>
    </div>
  </div>
</header>

<main id="list"><div class="empty">載入中…</div></main>
<button class="fab" id="newBlock">＋ 新增叫藥單</button>
<input type="file" id="fileInput" accept="image/*,application/pdf" hidden>

<div class="overlay" id="overlay"></div>

<!-- 新增品項（一步一步問）-->
<div class="sheet" id="wiz"></div>

<!-- 分享到 LINE -->
<div class="sheet" id="shareSheet">
  <h2 id="shareTitle">叫藥清單已生成 🎉</h2>
  <p class="sub" id="shareSub">分享到 LINE 群組。</p>
  <pre class="share" id="shareText"></pre>
  <div class="actions">
    <a class="btn line" id="lineBtn" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">分享到 LINE</a>
    <button class="btn" id="copyBtn">複製文字</button>
  </div>
  <div class="actions"><button class="btn" data-close>關閉</button></div>
</div>

<!-- 設定 -->
<div class="sheet" id="setSheet"></div>

<div class="sheet" id="askSheet">
  <h2 id="askTitle"></h2>
  <p class="sub">輸入進度說明（會放進「進度分享」）</p>
  <input class="big" id="askInput" placeholder="備2" autocomplete="off" enterkeyhint="done">
  <div class="actions"><button class="btn" id="askNo">取消</button><button class="btn primary" id="askOk">確認</button></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
// API_URL 放在 config.js（這樣更新 index.html 時就不用重填）

const APP_VERSION = '2026-10-29.11'; // 每次更新 index.html 會改這個
const PROGRESS = ['已訂貨', '已調貨', '缺藥', '其他'];
const SLIP = ['已key', '缺貨單'];
const slipName = s => ({ '貨單已key': '已key', '缺貨單需要電子檔': '缺貨單' }[s] || s || ''); // 舊資料換成新名稱
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d = '') { try { return localStorage.getItem('jy_' + k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jy_' + k, v); } catch (e) {} },
};
const today = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const fmtQty = (q, u) => (q === null || q === undefined || q === '') ? (u ? '? ' + u : '') : `${q} ${u || ''}`.trim();

let S = { blocks: [], drugs: [], lists: { vendors: [], units: [], staff: [] } };
let me = store.get('name'), pass = store.get('pass');

// ======================== 主題 ========================
function applyTheme() {
  const t = store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#011F4B' : '#314448';
}
$('themeBtn').onclick = () => { store.set('theme', document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); applyTheme(); };
applyTheme();

// ======================== 連線 ========================
let pending = 0;
async function api(action, data = {}, retried) {
  pending++; $('saving').classList.add('on');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免跨網域預檢
      body: JSON.stringify(Object.assign({ action, pass, by: me }, data)),
    });
    const j = await res.json();
    if (!j.ok && !retried && /BUSY:|鎖定|lock/i.test(j.error || '')) {
      pending--; await new Promise(r => setTimeout(r, 2500)); pending++;
      return api(action, data, true); // 伺服器忙，自動再試一次
    }
    if (!j.ok) {
      j.error = String(j.error || '').replace(/^BUSY:/, '');
      if (j.code === 'PASS') { openSettings('me', '團隊密碼錯誤，請重新輸入'); }
      throw new Error(j.error || '發生錯誤');
    }
    applyRes(j);
    return j;
  } catch (e) {
    if (e instanceof TypeError) e = new Error('連線失敗，請檢查網路或 API 網址');
    throw e;
  } finally {
    if (--pending <= 0) { pending = 0; $('saving').classList.remove('on'); }
  }
}
function applyRes(j) {
  if (j.blocks) S.blocks = j.blocks;
  if (j.drugs) S.drugs = j.drugs;
  if (j.lists) S.lists = j.lists;
  if (j.deleted) S.blocks = S.blocks.filter(b => b.id !== j.deleted);
  if (j.block) {
    const i = S.blocks.findIndex(b => b.id === j.block.id);
    if (i < 0) S.blocks.unshift(j.block);
    else if ((j.block.updatedAt || 0) >= (S.blocks[i].updatedAt || 0)) S.blocks[i] = j.block; // 舊回應不蓋掉新資料
    renderBlock(j.block.id);
  }
  if (j.blocks || j.deleted) render();
}
async function run(action, data, okMsg) {
  try { const j = await api(action, data); if (okMsg) toast(okMsg); return j; }
  catch (e) { toast(e.message); load(true); }
}

// ======================== 畫面 ========================
const findBlock = id => S.blocks.find(b => b.id === id);
const findDrug = name => S.drugs.find(d => d.name === name);
function groups(b) {
  const order = [], map = {};
  b.items.forEach(it => {
    const v = it.vendor || '';
    if (!map[v]) { map[v] = []; order.push(v); }
    map[v].push(it);
  });
  return order.map(v => ({ vendor: v, items: map[v] }));
}
const opts = (list, cur, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') +
  [...new Set([...(list || []), ...(cur ? [cur] : [])])].map(v => `<option${v === cur ? ' selected' : ''}>${esc(v)}</option>`).join('');

let view = 'main'; // main | history
const isArch = (b, vendor) => !!((b.vendors || {})[vendor || ''] || {}).archived;
const liveGroups = b => groups(b).filter(g => b.status !== 'generated' || !isArch(b, g.vendor));
const onMain = b => b.status !== 'generated' || !b.items.length || liveGroups(b).length > 0;
// 某一天的廠商卡，順序和畫面一樣（新的在上）
function dayCards(date) {
  const out = [];
  S.blocks.filter(b => b.status === 'generated' && b.date === date && onMain(b)).forEach(b => liveGroups(b).forEach(g => out.push({ b, g })));
  return out.sort((x, y) => (y.b.generatedAt || 0) - (x.b.generatedAt || 0));
}
// 這張卡第一個品項的編號前面有幾項（同一天的編號連續）
function cardStart(b, vendor) {
  let n = 0;
  for (const c of dayCards(b.date)) { if (c.b.id === b.id && c.g.vendor === (vendor || '')) return n; n += c.g.items.length; }
  return 0;
}
function render() {
  const el = $('list');
  document.body.classList.toggle('hist', view === 'history');
  $('histBtn').textContent = view === 'history' ? '← 返回' : '📚 歷史';
  if (view === 'history') return renderHistory();
  const list = S.blocks.filter(onMain);
  if (!list.length) {
    el.innerHTML = '<div class="empty">目前沒有進行中的叫藥單<br>按下方「＋ 新增叫藥單」開始</div>';
    return;
  }
  // 草稿在最上面；已生成的廠商卡依「日期」分組，新的日期在上
  const drafts = list.filter(b => b.status !== 'generated');
  const days = {};
  list.filter(b => b.status === 'generated').forEach(b => liveGroups(b).forEach(g => (days[b.date] = days[b.date] || []).push({ b, g })));
  const W_ = ['日', '一', '二', '三', '四', '五', '六'];
  const dayHTML = Object.keys(days).sort().reverse().map(d => {
    const cards = days[d].sort((x, y) => (y.b.generatedAt || 0) - (x.b.generatedAt || 0));
    const dt = new Date(d + 'T00:00:00'), wk = isNaN(dt) ? '' : `（${W_[dt.getDay()]}）`;
    return `<div class="day" data-date="${esc(d)}"><div class="day-h"><span>📅 <span class="dlong">${esc(d)}</span><span class="dshort">${esc(d.slice(5).replace('-', '/'))}</span>${wk}<small>${cards.length} 家廠商</small></span>
        <span class="day-btns"><button class="day-share"><span class="long">再次生成</span>叫藥清單</button><button class="day-prog">進度分享</button></span></div>
      ${(() => { let s = 0; return cards.map(c => { const h_ = vendorCardHTML(c.b, c.g, s); s += c.g.items.length; return h_; }).join(''); })()}</div>`;
  }).join('');
  el.innerHTML = drafts.map(blockHTML).join('') + dayHTML;
}
function renderBlock(id) {
  if (view === 'history') return render();
  const bb = findBlock(id);
  if (!bb || bb.status === 'generated' || document.querySelector(`.day .block[data-id="${CSS.escape(id)}"]`)) return render(); // 已生成的卡要重新分組
  const b = findBlock(id), olds = [...document.querySelectorAll(`.block[data-id="${CSS.escape(id)}"]`)];
  if (!olds.length) return render();
  if (b && onMain(b)) {
    const t = document.createElement('div'); t.innerHTML = blockHTML(b);
    [...t.children].forEach(n => olds[0].before(n));
  }
  olds.forEach(o => o.remove());
  if (!document.querySelector('.block')) render();
}

function blockHTML(b) {
  if (b.status === 'generated') return liveGroups(b).map(g => vendorCardHTML(b, g)).join('');
  const head = `<div class="b-head">
      <input type="date" class="b-date" value="${esc(b.date)}">
      <span class="b-meta">${b.items.length} 項 · ${esc(b.createdBy || '')}</span>
      <button class="icon b-del" aria-label="刪除整張">🗑</button>
    </div>`;
  const body = b.items.length ? groups(b).map(g => vendorHTML(b, g)).join('') :
    `<div class="empty" style="padding:20px">按「＋ 新增品項」加入要叫的藥</div>`;
  const foot = `<div class="b-foot">
      <button class="btn ghost add-item">＋ 新增品項</button>
      <button class="btn primary gen"${b.items.length ? '' : ' disabled'}>生成叫藥清單並通知群組</button>
    </div>`;
  return `<section class="block is-draft" data-id="${esc(b.id)}"><div class="draft-tag"><span>草<br>稿</span></div><div class="draft-main">${head}${body}${foot}</div></section>`;
}

// 已生成：每個廠商一張獨立的卡
// 直排：一個中文字一行，英文數字連在一起
const vtext = s => (String(s).match(/[A-Za-z0-9.\-]+|\S/gu) || []).map(esc).join('<br>');
function vendorCardHTML(b, g, start = 0) {
  const v = (b.vendors || {})[g.vendor] || {};
  const files = (v.files || []).map(f => `<div>📄 <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
      <span class="by">${esc(f.by || '')}</span><button class="x fdel" data-file="${esc(f.id)}" aria-label="刪除檔案">×</button></div>`).join('');
  return `<section class="block is-gen" data-id="${esc(b.id)}" data-vendor="${esc(g.vendor)}">
      <div class="v-side gen-side">
        <span class="vs-name">${vtext(g.vendor || '未指定廠商')}</span>
        <button class="sbtn vshare line-chip">進度<br>分享</button>
        <button class="sbtn vbtn" data-p="已訂貨" style="--c:var(--p-已訂貨)">全部<br>已訂</button>
        <button class="sbtn vbtn" data-p="已調貨" style="--c:var(--p-已調貨)">全部<br>已調</button>
      </div><div class="v-main">
      <div class="v-title vcard-title">
        <div class="vt-name"><small>${g.items.length} 項 · ${esc(b.generatedBy || b.createdBy || '')}</small><button class="icon b-del" aria-label="刪除這個廠商">🗑</button></div>
        <div class="t-row">
          <select class="f slip" aria-label="貨單狀態">${opts(SLIP, slipName(v.slip), '貨單')}</select>
          <span class="by-lbl">by</span>
          <select class="f slipby" aria-label="貨單處理人員">${opts(S.lists.staff, v.slipBy, '人員')}</select>
          <div class="t-stack">
            <button class="chipbtn upload">📎 貨單上傳</button>
            <button class="chipbtn archive">歸檔</button>
          </div>
        </div>
      </div>
      ${g.items.map((it, i) => genItemHTML(it, start + i)).join('')}
      <div class="v-foot">
        ${files ? `<div class="files">${files}</div>` : ''}
        <button class="btn ghost add-item">＋ 新增品項（${esc(g.vendor || '未指定廠商')}）</button>
      </div>
    </div></section>`;
}

function vendorHTML(b, g) {
  const gen = b.status === 'generated';
  const v = (b.vendors || {})[g.vendor] || {};
  const rows = g.items.map(it => gen ? genItemHTML(it) : draftItemHTML(it)).join('');
  let foot = '';
  if (gen) {
    const files = (v.files || []).map(f => `<div>📄 <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
        <span class="by">${esc(f.by || '')}</span><button class="x fdel" data-file="${esc(f.id)}" aria-label="刪除檔案">×</button></div>`).join('');
    foot = `<div class="v-foot">
        <div class="grid2">
          <button class="chipbtn vshare line-chip">進度分享</button>
          <button class="chipbtn vbtn" data-p="已訂貨" style="--c:var(--p-已訂貨)">全部已訂</button>
          <button class="chipbtn vbtn" data-p="已調貨" style="--c:var(--p-已調貨)">全部已調</button>
          <button class="chipbtn upload">📎 貨單上傳</button>
        </div>
        <div class="row">
          <span class="lbl">貨單 by</span>
          <select class="f slipby" aria-label="貨單處理人員">${opts(S.lists.staff, v.slipBy, '人員')}</select>
        </div>
        ${files ? `<div class="files">${files}</div>` : ''}
      </div>`;
  }
  const right = gen ? `<div class="v-right">
        <select class="f slip" aria-label="貨單狀態">${opts(SLIP, v.slip, '— 貨單狀態 —')}</select>
        <button class="chipbtn archive">歸檔</button></div>` : `<small>${g.items.length} 項</small>`;

const onListChange = e => {
  const t = e.target;
  if (e.type === 'input' && t.tagName !== 'SELECT') return;
  if (t.tagName === 'SELECT') { if (t.dataset.sent === t.value) return; t.dataset.sent = t.value; }
  const c = ctx(t);
  if (t.classList.contains('b-date')) return run('updateBlock', { id: c.blockId, date: t.value });
  const patchKey = { qty: 'qty', unit: 'unit', vendor: 'vendor', prog: 'progress', oq: 'orderQty', ou: 'orderUnit', 'note-in': 'note', 'pnote-in': 'progressNote' };
  if (t.classList.contains('prog') && t.value === '其他') {
    const b = findBlock(c.blockId), it = b && b.items.find(x => x.id === c.itemId);

      t.dataset.p = '其他';

        const nb = j && j.block, ni = nb && nb.items.find(x => x.id === c.itemId);

    }, () => { t.value = prev || ''; t.dataset.sent = t.value; t.dataset.p = prev || ''; });
  }
  for (const cls in patchKey) if (t.classList.contains(cls)) {
    if (cls === 'prog') t.dataset.p = t.value;
    return run('updateItem', { blockId: c.blockId, itemId: c.itemId, patch: { [patchKey[cls]]: t.value } });
  }
  if (t.classList.contains('slip')) return run('vendorSlip', { blockId: c.blockId, vendor: c.vendor, slip: t.value });
  if (t.classList.contains('slipby')) return run('vendorSlip', { blockId: c.blockId, vendor: c.vendor, slipBy: t.value });
};

// ======================== 新增品項（一步一步）========================
let W = null;
function openWizard(blockId, fixedVendor) { W = { blockId, fixedVendor, step: 'drug', drug: '', vendor: fixedVendor || '', qty: '', unit: '', known: null, edited: false }; showSheet('wiz'); drawWiz(); }
const fixedV = () => W.fixedVendor !== undefined;
function nextStep() {
  if (!W.vendor && !fixedV()) W.step = 'vendor';
  else if (W.step === 'vendor' || W.step === 'drug') W.step = 'qty';
  else if (W.step === 'qty') W.step = W.unit ? 'save' : 'unit';
  else W.step = 'save';
  if (W.step === 'save') return saveWiz();

}
function chooseDrug(name) {

  const d = findDrug(name);
  W.drug = name; W.known = d || null;
  W.vendor = fixedV() ? W.fixedVendor : (d && d.vendor || ''); W.unit = d && d.unit || '';
  W.qty = d && d.qty !== null && d.qty !== undefined ? d.qty : '';

function drawWiz() {

  const close = `<div class="actions"><button class="btn" data-close>完成</button></div>`;
  if (W.step === 'drug') {
    el.innerHTML = `${head}
      <input class="big" id="wDrug" placeholder="輸入藥品關鍵字，按 Enter" autocomplete="off" enterkeyhint="next">

      const list = S.drugs.filter(d => !q || d.name.toLowerCase().includes(q)).slice(0, 8);
      $('wSugg').innerHTML = list.map(d => `<button data-name="${esc(d.name)}">${esc(d.name)}<small>${esc([d.vendor, fmtQty(d.qty, d.unit)].filter(Boolean).join(' · '))}</small></button>`).join('')

    $('wSugg').onclick = e => { const b = e.target.closest('button'); if (b) chooseDrug(b.dataset.name); };
    draw(); setTimeout(() => inp.isConnected && inp.focus(), 50);
    return;
  }
  if (W.step === 'vendor' || W.step === 'unit') {

    el.innerHTML = `${head}<label class="lbl">${isV ? '選擇廠商' : '選擇單位'}</label>
      <div class="chips" id="wChips">${list.map(v => `<button class="chip${v === cur ? ' on' : ''}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>
      <input class="big" id="wNew" style="margin-top:12px" placeholder="${isV ? '或輸入新廠商' : '或輸入新單位'}，按 Enter" autocomplete="off">
      <div class="actions"><button class="btn" id="wBack">上一步</button></div>`;
    const pick = v => { v = v.trim(); if (!v) return; if (isV) W.vendor = v; else W.unit = v; if (W.known) W.edited = true; W.step = isV ? 'vendor' : 'unit'; nextStep(); };
    $('wChips').onclick = e => { const b = e.target.closest('.chip'); if (b) pick(b.dataset.v); };
    $('wNew').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); pick(e.target.value); } };
    $('wBack').onclick = () => { W.step = isV ? 'drug' : 'qty'; drawWiz(); };
    if (!list.length) setTimeout(() => $('wNew') && $('wNew').focus(), 50);
    return;
  }
  if (W.step === 'qty') {
    const changed = W.known && (W.unit !== (W.known.unit || '') || (!fixedV() && W.vendor !== (W.known.vendor || '')));
    el.innerHTML = `${head}
      <div class="summary">
        <button id="wEditV"${fixedV() ? ' disabled' : ''}>${esc(W.vendor || '未指定廠商')}${fixedV() ? '' : ' ✎'}</button>

      <label class="lbl" style="display:block;margin-top:12px">需求備註（選填）</label>
      <input class="big" id="wNote" value="${esc(W.note || '')}" placeholder="備1" autocomplete="off" enterkeyhint="done">
      ${W.known ? `<label class="check"><input type="checkbox" id="wDef" ${changed || W.edited ? 'checked' : ''}> 把這次的廠商／數量／單位設為「${esc(W.drug)}」的預設</label>` : ''}

    $('wNote').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); } };
    $('wOk').onclick = go;

    $('wEditV').onclick = () => { keep(); W.step = 'vendor'; drawWiz(); };
    $('wEditU').onclick = () => { keep(); W.step = 'unit'; drawWiz(); };
    setTimeout(() => { const q = $('wQty'); if (q) { q.focus(); q.select(); } }, 50);
  }
}

async function generate(b) {

// openExternalBrowser=1：從 LINE 點連結會直接用 Safari / Chrome 開，不用 LINE 內建瀏覽器
function appUrl(b) { return location.origin + location.pathname + '?date=' + encodeURIComponent(b.date) + '&openExternalBrowser=1'; }
function shareText(b) {
  const lines = [`${String(b.date).slice(5)} 需要調貨`];
  let n = 0; // 編號跨廠商連續
  groups(b).forEach(g => {
    lines.push(`【${g.vendor || '未指定廠商'}】`);
    g.items.forEach(it => lines.push(`${++n}. ${it.drug}　需要 ${fmtQty(it.orderQty ?? it.qty, it.orderUnit || it.unit)}${it.note ? '（' + it.note + '）' : ''}`));
  });
  return lines.join('\n');
}
const ICON = { '已訂貨': '✅', '已調貨': '☑️', '缺藥': '⚠️', '其他': '❕' };
function nowStr() { const d = new Date(), p = n => String(n).padStart(2, '0'); return { date: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`, time: `${p(d.getHours())}:${p(d.getMinutes())}` }; }
function progressText(b, vendor, start = 0) {
  const gs = vendor === undefined ? liveGroups(b) : groups(b).filter(g => g.vendor === vendor);
  const n = gs.reduce((s, g) => s + g.items.length, 0), now = nowStr();
  const when = now.date === b.date ? `${b.date} ${now.time}` : `${b.date}（${now.date} ${now.time} 更新）`;
  const lines = [];
  const SHORT = { '已訂貨': '已訂', '已調貨': '已調', '缺藥': '缺藥', '其他': '其他' };
  let k = start; // 編號跨廠商連續，和卡片上的編號一樣
  gs.forEach(g => {
    lines.push(`【${g.vendor || '未指定廠商'}】`);
    g.items.forEach(it => {
      if (it.progress === '其他') { // 其他：只放 ❕ + 備2 的文字
        lines.push(`${++k}. ${it.drug}　❕${it.progressNote ? '（' + it.progressNote + '）' : '其他'}`);
        return;
      }
      const st = it.progress ? ICON[it.progress] + ' ' + SHORT[it.progress] : '⏳ 未處理';
      const qty = it.progress === '缺藥' ? '' : ' ' + fmtQty(it.orderQty ?? it.qty, it.orderUnit || it.unit);
      lines.push(`${++k}. ${it.drug}　${st}${qty}${it.progressNote ? '（' + it.progressNote + '）' : ''}`);
    });
  });
  return lines.join('\n');
}

function shareDay(date, mode = 'list') {

function askText(title, value, ok, cancel) {
  $('askTitle').textContent = title; $('askInput').value = value || '';
  askCb = { ok, cancel };
  showSheet('askSheet');
  setTimeout(() => $('askInput').focus(), 60);
}
function askDone(confirmed) {
  const cb = askCb; askCb = null;
  const v = $('askInput').value.trim();
  closeSheets();
  if (!cb) return;
  if (confirmed) cb.ok(v); else cb.cancel && cb.cancel();
}
$('askOk').onclick = () => askDone(true);
$('askNo').onclick = () => askDone(false);
$('askInput').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); askDone(true); } };

// ======================== 貨單上傳 ========================
let upCtx = null;
function pickFile(c) { upCtx = c; $('fileInput').value = ''; $('fileInput').click(); }
$('fileInput').onchange = async () => {
  const f = $('fileInput').files[0]; if (!f || !upCtx) return;
  const c = upCtx; upCtx = null;
  try {
    toast('上傳中…');
    let blob = f, name = f.name || '貨單';
    if (f.type.startsWith('image/')) { blob = await shrinkImage(f); name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
    if (blob.size > 20 * 1024 * 1024) throw new Error('檔案太大（上限約 20MB）');
    const data = await toBase64(blob);
    const vName = c.vendor || '未指定廠商', b = findBlock(c.blockId);
    await api('upload', { blockId: c.blockId, vendor: c.vendor, name: `${b ? b.date : ''}_${vName}_${name}`, mime: blob.type || f.type, data });
    toast('貨單已上傳');
  } catch (e) { toast(e.message || '上傳失敗'); }
};
function toBase64(blob) {
  return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
}
function shrinkImage(file, max = 1800) {
  return new Promise(ok => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => ok(b || file), 'image/jpeg', .82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(file); };
    img.src = url;
  });
}

// ======================== 設定 ========================
let setTab = 'drugs';
function openSettings(tab, msg) { setTab = tab || setTab; showSheet('setSheet'); drawSettings(msg); }
$('setBtn').onclick = () => openSettings('drugs');
$('meBtn').onclick = () => openSettings('me');
function drawSettings(msg) {
  const el = $('setSheet');
  const tabs = [['drugs', '藥品'], ['vendors', '廠商'], ['units', '單位'], ['staff', '人員'], ['me', '我的設定']];
  let body = '';
  if (setTab === 'me') {
    body = `${msg ? `<p class="sub" style="color:var(--danger)">${esc(msg)}</p>` : ''}
      <label class="lbl">我的名字（處理進度會顯示這個名字）</label>
      <input class="big" id="sName" value="${esc(me)}" maxlength="12" placeholder="例如：小楊">
      <label class="lbl" style="display:block;margin-top:12px">團隊密碼</label>
      <input class="big" id="sPass" value="${esc(pass)}" type="password" autocomplete="off" placeholder="問管理者">
      <div class="actions"><button class="btn primary" id="sSave">儲存</button></div>`;
  } else if (setTab === 'drugs') {
    body = `<input class="big" id="dSearch" placeholder="搜尋或新增藥品，按 Enter" autocomplete="off" enterkeyhint="done">
      <div id="dList" style="margin-top:10px"></div>
      <p class="note">輸入新藥名按 Enter 就會加入清單，再設定它的預設廠商、數量、單位（修改後自動儲存）。</p>`;
  } else {
    const label = { vendors: '廠商', units: '單位', staff: '人員' }[setTab];
    body = `<div class="chips" id="lChips">${(S.lists[setTab] || []).map(v => `<span class="chip">${esc(v)}<button class="rm icon" data-v="${esc(v)}" aria-label="移除">×</button></span>`).join('') || `<span class="note">還沒有${label}</span>`}</div>
      <input class="big" id="lNew" style="margin-top:12px" placeholder="新增${label}，按 Enter" autocomplete="off">`;
  }
  el.innerHTML = `<h2>設定 <span class="ver">版本 ${APP_VERSION}</span></h2><div class="tabs">${tabs.map(([k, n]) => `<button data-tab="${k}" class="${k === setTab ? 'on' : ''}">${n}</button>`).join('')}</div>
    ${body}<div class="actions"><button class="btn" data-close>關閉</button></div>`;
  el.querySelector('.tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { setTab = b.dataset.tab; drawSettings(); } };

  if (setTab === 'me') {
    $('sSave').onclick = async () => {
      const n = $('sName').value.trim(), p = $('sPass').value.trim();
      if (!n || !p) return toast('名字和密碼都要填');
      me = n; pass = p; store.set('name', n); store.set('pass', p); showMe();
      const ok = await load();
      if (ok) { closeSheets(); toast('已儲存'); }
    };
  } else if (setTab === 'drugs') {
    const draw = () => {
      const q = $('dSearch').value.trim().toLowerCase();
      const list = S.drugs.filter(d => !q || d.name.toLowerCase().includes(q));
      const raw = $('dSearch').value.trim();
      const addBtn = raw && !findDrug(raw) ? `<button class="btn ghost dAdd" style="width:100%;margin-bottom:8px">＋ 新增「${esc(raw)}」</button>` : '';
      $('dList').innerHTML = addBtn + list.map(d => `<div class="drow" data-name="${esc(d.name)}">
          <div class="it-top"><input class="f dN" value="${esc(d.name)}" aria-label="藥品名稱" autocomplete="off"><button class="x dDel" aria-label="刪除藥品">×</button></div>
          <div class="ctrls">
            <select class="f dV">${opts(S.lists.vendors, d.vendor, '預設廠商')}</select>
            <input class="f dQ" type="number" inputmode="decimal" min="0" step="any" value="${d.qty ?? ''}" placeholder="數量">
            <select class="f dU">${opts(S.lists.units, d.unit, '單位')}</select>
          </div></div>`).join('') + (list.length || addBtn ? '' : '<p class="note">還沒有藥品，在上面輸入藥名按 Enter 新增</p>');
    };
    const addDrug = async () => {
      const name = $('dSearch').value.trim();
      if (!name || findDrug(name)) return;
      const j = await run('saveDrug', { drug: { name, vendor: '', qty: '', unit: '' } }, `已新增 ${name}，請設定預設值`);
      if (j) { draw(); }
    };
    $('dSearch').oninput = draw; draw();
    $('dSearch').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addDrug(); } };
    $('dList').onchange = e => {
      const row = e.target.closest('.drow'); if (!row) return;
      const newName = row.querySelector('.dN').value.trim();
      if (!newName) { row.querySelector('.dN').value = row.dataset.name; return toast('藥品名稱不能空白'); }
      run('saveDrug', { oldName: row.dataset.name, drug: { name: newName, vendor: row.querySelector('.dV').value, qty: row.querySelector('.dQ').value, unit: row.querySelector('.dU').value } },
        newName !== row.dataset.name ? '已改名' : '已更新預設').then(j => { if (j) { row.dataset.name = newName; } else draw(); });
    };
    $('dList').onclick = async e => {
      if (e.target.closest('.dAdd')) return addDrug();
      const b = e.target.closest('.dDel'); if (!b) return;
      const name = b.closest('.drow').dataset.name;
      if (confirm(`從清單刪除「${name}」？（已經叫過的紀錄不受影響）`)) { await run('deleteDrug', { name }, '已刪除'); draw(); }
    };
  } else {
    const save = async list => { await run('saveLists', { lists: { [setTab]: list } }); drawSettings(); render(); };
    $('lChips').onclick = e => { const b = e.target.closest('.rm'); if (b) save(S.lists[setTab].filter(v => v !== b.dataset.v)); };
    $('lNew').onkeydown = e => {
      if (e.key !== 'Enter' || e.isComposing) return;
      const v = e.target.value.trim(); if (!v) return;
      save([...(S.lists[setTab] || []), v]);
    };
    setTimeout(() => $('lNew') && $('lNew').focus(), 50);
  }
}
function showMe() { $('meBtn').textContent = '👤 ' + (me || '設定名字'); }
function ready() { if (!me || !pass) { openSettings('me', '先設定名字和團隊密碼'); return false; } return true; }

// ======================== 彈窗 / 提示 ========================
function showSheet(id) { closeSheets(true); $('overlay').classList.add('open'); $(id).classList.add('open'); }
function closeSheets(keepOverlay) {
  document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
  if (!keepOverlay) $('overlay').classList.remove('open');
  if (!keepOverlay && W) { W = null; }
}
$('overlay').onclick = () => { if (askCb) return askDone(false); closeSheets(); };
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheets(); });
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), m.length > 18 ? 4500 : 2400); }

// ======================== 載入 ========================
let firstLoad = true;
async function load(quiet) {
  if (typeof API_URL === 'undefined' || !API_URL.startsWith('https://')) { $('list').innerHTML = '<div class="empty">請先在 config.js 填入 API_URL（並和 index.html 放在同一個資料夾）</div>'; return false; }
  if (!me || !pass) { if (!quiet) openSettings('me', '先設定名字和團隊密碼'); return false; }
  const btn = $('refresh'); btn.classList.add('spin');
  try {
    await api('init');
    if (firstLoad) { firstLoad = false; jumpToLinked(); }
    return true;
  } catch (e) {
    if (!quiet) toast(e.message);
    if (!S.blocks.length) $('list').innerHTML = `<div class="empty">載入失敗：${esc(e.message)}</div>`;
    return false;
  } finally { btn.classList.remove('spin'); }
}
function jumpToLinked() {
  const q = new URLSearchParams(location.search), id = q.get('id'), date = q.get('date');
  if (date) {
    const day = document.querySelector(`.day[data-date="${CSS.escape(date)}"]`);
    if (!day) return toast('這天的叫藥單可能已經全部歸檔');
    setTimeout(() => { day.scrollIntoView({ behavior: 'smooth', block: 'start' }); day.querySelectorAll('.block').forEach(e => e.classList.add('flash')); }, 150);
    return;
  }
  if (!id) return;
  const els = document.querySelectorAll(`.block[data-id="${CSS.escape(id)}"]`);
  if (!els.length) return toast('找不到這張叫藥單，可能已歸檔或刪除');
  setTimeout(() => { els[0].scrollIntoView({ behavior: 'smooth', block: 'start' }); els.forEach(e => e.classList.add('flash')); }, 150);
}
$('refresh').onclick = async () => { if (await load()) toast('已重新整理'); };

// 自動更新：畫面在前景、沒有在輸入、沒開視窗時，每 40 秒抓一次
function idle() {
  const a = document.activeElement;
  return !document.hidden && !document.querySelector('.sheet.open') && !(a && a.closest && a.closest('#list') && a.matches('input,select'));
}
setInterval(() => { if (idle() && pending === 0) load(true); }, 40000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && idle()) load(true); });

showMe();
load();
</script>
